# Release lock for v2.0.0-alpha1: the exact components every alpha1 package must be built from.
# Checked against the built packages by tools/check_release.sh (see release/README.md).
# Format: ini. [section] lines, `key = value` lines, `#` comment lines (a comment never follows a value).
# Keys read by the checker: release.version/channel/sdk, launcher.commit, emunxt.describe, emu.describe,
# ext_store.version, pscbios.version. The rest is the record of what was pinned and is not checkable in a package.

[release]
# the version the packages show (VERSION file, the launcher's version string); a package may append -<launcher hash>
version = v2.0.0-alpha1-rc1
# the channel the launcher is built with (AB_BUILD_CHANNEL): dev | nightly | prerelease | release
channel = prerelease
# the extension ABI (the number after sdk= in the SDK stamp of the launcher and of every extension)
sdk = 8
targets = psc rpi rpi64 pcusb win
# win ships three files: the plain package, the product package (with the emulators) and the installer
win_files = product installer

[launcher]
repo = autobleem
branch = integration/alpha1
commit = 9824908c

[core]
repo = autobleem-core
commit = d6ef21b

[themes]
repo = autobleem-themes
commit = a9f8045

[emunxt]
repo = pcsx-abnxt
commit = b2261f50
describe = v2.0.0-alpha0-12-gb2261f50

[libpicofe]
repo = libpicofe
commit = 5ffbdd5

[emu]
repo = pcsx-ab
commit = ad56939
describe = v2.0.0-alpha2-23-gad56939

[ext_store]
repo = ext_store
commit = 9b7a060
# the extension.ini Version of the bundled Store
version = 1.0.1

[pscbios]
repo = console-tools
commit = 67d799c
# the extension.ini Version of the bundled PSC-Bios
version = 2.0.0
