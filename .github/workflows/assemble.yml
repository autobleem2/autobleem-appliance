# Assemble the appliance payloads from PUBLISHED component artifacts - the compile-once/assemble-many
# model (docs/repo-split-analysis.md). This workflow compiles NOTHING: assemble.sh fetches each Linux
# component's release assets (the launcher incl. abpad + themes from autobleem2/autobleem, the two emulators
# from autobleem2/pcsx-ab and pcsx-abnxt) at one unified VERSION and composes payload_linux into
# autobleem-<platform>-<version>.tar.gz; assemble-psc.sh does the same for the console (platform "psc") from
# the launcher's psc artifact (which also carries the psc skeleton - see publish-launcher.yml), the console
# tools (autobleem2/autobleem-console-tools) and the emulators' -psc assets, into
# autobleem-psc-<version>.tar.gz - no RetroArch and no cover databases, same reasoning as the Linux
# appliances' install-time fetches (the console has no network at all, so AutoBleemInstaller.exe fetches
# those on the PC instead - see assemble-psc.sh's own header). psc is in the default platforms since
# v2.0.0-alpha2 (proven by dispatch runs 2026-09-23), so a v* tag assembles and publishes it with the rest.
#
# Platform "win" is the Windows product (assemble-win.sh): the launcher's program folder (publish-launcher.yml's
# win target) with both emulators' win64 packages and autobleem-pc-tools' AutoBleemWinSetup.exe, zipped as
# autobleem-win-product-<v>.zip and packed by makensis into AutoBleemSetup-<v>.exe. No image either.
#
# Because it only downloads + tars, it runs on a plain hosted runner (gh is preinstalled there). Building the
# flashable .img.xz from a payload is a separate, self-hosted step (it needs root/loop-mount or the rootless
# debugfs path and the autobleem-build image's tools) - see tools/make_rpi_image.sh / make_pc_image.sh; that
# job is added once a self-hosted runner is registered for this repo.
#
# A v* tag on this repo is the normal trigger (VERSION = the tag itself - every component must already have
# a release there, which the emulators + the launcher publish on their own v* tags); workflow_dispatch takes
# an explicit version for a re-run or a dry run against an unreleased version. Gated by AB_CI_ENABLED.
#
# The development build (channel `nightly`: the nightly schedule, or a manual run with channel=nightly) is
# the same assembly from every component's rolling `nightly` pre-release - what each one's develop CI keeps
# current through autobleem-build's nightly-release action - named after the launcher's build (git describe,
# v2.0.0-alpha2-5-gabc1234) and published to the site's nightly/<version>/ (the page's "dev" channel; never
# an update channel). The schedule skips a night on which no component's nightly changed (sources.json in
# the published folder is the fingerprint it compares). The pieces - each image as it is built, then the
# packages - are published with repo_publish.sh --partial, which the site's index leaves out; the last job,
# publish-nightly, publishes sources.json and indexes once every piece is there, and only then does the new
# build replace the previous nightly (until 2026-09-23 the first image of a run pruned the previous one, PC
# image and all, and the site had a half-built nightly for as long as the run took).
#
# The nightly is event-driven since 2026-09-26: a component's develop build, once its `nightly` pre-release
# holds the new files, sends a `component-nightly` repository_dispatch here (autobleem-build's nightly-release
# action, `dispatch-token`), and this runs at once instead of waiting for the schedule (which GitHub started
# five hours late every day). Such a run waits AB_NIGHTLY_SETTLE_SECONDS (default 180) first, so the sibling
# builds of a multi-repository change (a core bump reaches the launcher, the console tools and the Store within
# minutes) are in the same assembly, and skips like the schedule when the fingerprint is already published.
# The concurrency group never cancels: GitHub keeps one run going and one pending, a newer pending run
# replacing the older - a burst of pushes gives at most two assemblies, and a half-built nightly is never
# killed. The schedule stays as the safety net (a component whose token was missing, a failed dispatch).
#
# `images: false` (workflow_dispatch) assembles and publishes the packages without the three disk images -
# the fast "packages only" build. Its sources.json says so, and an automatic run with the same components
# builds the images rather than skip.
name: assemble

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  # a component's nightly-release (see above): client_payload {repo, sha, version}
  repository_dispatch:
    types: [component-nightly]
  workflow_dispatch:
    inputs:
      channel:
        description: release = the components' v* releases; nightly = their rolling develop builds
        type: choice
        options: [release, nightly]
        default: release
      version:
        description: the unified component version to assemble (e.g. v2.0.0-alpha1) - defaults to the pushed tag; not used for nightly
        type: string
      platforms:
        description: platforms to assemble (space separated; rpi-armhf rpi-arm64 pcusb psc win)
        type: string
        default: 'rpi-armhf rpi-arm64 pcusb psc win'
      images:
        description: build the disk images too (false = packages only, fast)
        type: boolean
        default: true
      skip_unchanged:
        description: nightly only - do nothing when the site already has a nightly built from these same components
        type: boolean
        default: false

# never cancel: one run going, at most one pending (GitHub replaces an older pending run with a newer one) -
# a debounce, not a kill switch. A schedule, a repository_dispatch and a dispatch on develop share the group.
concurrency:
  group: assemble-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.p.outputs.json }}
      platform_list: ${{ steps.p.outputs.list }}
      image_platforms: ${{ steps.p.outputs.image_json }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      source_tag: ${{ steps.v.outputs.source_tag }}
      sources: ${{ steps.v.outputs.sources }}
      skip: ${{ steps.v.outputs.skip }}
      images: ${{ steps.p.outputs.images }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Let a multi-repository change settle
        if: github.event_name == 'repository_dispatch'
        env:
          FROM_REPO: ${{ github.event.client_payload.repo }}
          FROM_VERSION: ${{ github.event.client_payload.version }}
          SETTLE: ${{ vars.AB_NIGHTLY_SETTLE_SECONDS }}
        run: |
          # the components' nightlies of one change land minutes apart; wait for the siblings so one assembly
          # carries them all (one arriving meanwhile queues as the pending run, and skips if it has nothing new)
          s="${SETTLE:-180}"; [[ "$s" =~ ^[0-9]+$ ]] || s=180
          echo "started by $FROM_REPO's nightly ${FROM_VERSION:-?}; waiting ${s}s for its siblings"
          sleep "$s"
      - id: p
        run: |
          p="${{ inputs.platforms }}"; [ -n "$p" ] || p="rpi-armhf rpi-arm64 pcusb psc win"
          # images: only a dispatch can say false; a tag, the schedule and a component's dispatch build them.
          # Spelled out in bash: an absent boolean input compares equal to false in an expression
          images="${{ inputs.images }}"; [ "$images" = false ] || images=true
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "list=$(echo $p)" >> "$GITHUB_OUTPUT"
          echo "json=$(printf '%s\n' $p | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          # a separate, psc-filtered list for the image job below: the console has no flashable image (a
          # stick tarball unpacked by AutoBleemInstaller.exe, not an .img.xz), and matrix context isn't
          # available in a job-level `if:` (found live, 2026-09-23 - "Unrecognized named-value: 'matrix'"),
          # so the exclusion has to happen here instead of inside that job.
          echo "image_json=$(printf '%s\n' $p | { grep -v -e '^psc$' -e '^win$' || true; } | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - id: v
        run: |
          set -euo pipefail
          channel="${{ inputs.channel }}"
          case "${{ github.event_name }}" in schedule|repository_dispatch) channel=nightly ;; esac
          [ -n "$channel" ] || channel=release
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          if [ "$channel" = release ]; then
            v="${{ inputs.version }}"
            if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; fi
            [ -n "$v" ] || { echo "no version: push a v* tag, or pass workflow_dispatch's version input" >&2; exit 1; }
            echo "version=$v" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source_tag=nightly" >> "$GITHUB_OUTPUT"
          # what every component's nightly pre-release holds now: name, size and upload time of each asset
          fp=""
          for r in autobleem pcsx-ab pcsx-abnxt autobleem-console-tools autobleem-pc-tools proc_unzip ext_store; do
            id="$(gh api "repos/autobleem2/$r/releases/tags/nightly" --jq .id 2>/dev/null || true)"
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::autobleem2/$r has no nightly pre-release yet (its develop CI makes it)"; exit 1; }
            fp+="$(gh api --paginate "repos/autobleem2/$r/releases/$id/assets" --jq '.[] | "'"$r"' \(.name) \(.size) \(.updated_at)"' | sort)"$'\n'
          done
          # the build is named after the launcher's (launcher-psc-<git describe>.tar.gz) plus what it was built
          # from: -n<the components' fingerprint>. A night on which only an emulator or a tool changed is then a
          # new name too - an installed nightly compares its VERSION with this and sees the update (named after
          # the launcher alone, it saw the same version and was never offered it)
          d="$(printf '%s' "$fp" | sed -n 's/^autobleem launcher-psc-\(.*\)\.tar\.gz .*/\1/p' | head -n1)"
          [ -n "$d" ] || { echo "::error::no launcher-psc asset on autobleem2/autobleem@nightly"; exit 1; }
          sum="$(printf '%s' "$fp" | sha256sum | cut -c1-16)"
          v="$d-n${sum:0:6}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sources=$sum" >> "$GITHUB_OUTPUT"
          printf '%s' "$fp"
          # the schedule and a component's dispatch (and a dispatch that asks for it) skip when nothing changed:
          # the published folder's sources.json says what it was built from. A packages-only build's says
          # "images": false, a build of some platforms lists them - neither is enough for a run that asks for
          # more (a sources.json from before those keys was a full build)
          skip=false
          if [ "${{ github.event_name }}" != workflow_dispatch ] || [ "${{ inputs.skip_unchanged }}" = true ]; then
            src="$(curl -sf "https://autobleem.retromenele.pl/nightly/$v/sources.json" || true)"
            pub="$(sed -n 's/.*"platforms": *"\([^"]*\)".*/\1/p' <<< "$src")"
            [ -n "$pub" ] || pub="rpi-armhf rpi-arm64 pcusb psc win"
            covered=true
            for x in ${{ steps.p.outputs.list }}; do case " $pub " in *" $x "*) ;; *) covered=false ;; esac; done
            if grep -q "\"$sum\"" <<< "$src" && [ "$covered" = true ] &&
               { [ "${{ steps.p.outputs.images }}" = false ] || ! grep -q '"images": *false' <<< "$src"; }; then
              skip=true; echo "nightly/$v was built from these same components - nothing to do"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  assemble:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ubuntu-24.04
    env:
      # assemble.sh reaches the other public repos' releases through gh; the repo-scoped token reads public
      # releases across the org fine.
      GH_TOKEN: ${{ github.token }}
      # empty for a release (the components' VERSION release), `nightly` for the development build
      AB_SOURCE_TAG: ${{ needs.plan.outputs.source_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble ${{ matrix.platform }} @ ${{ needs.plan.outputs.version }}
        run: |
          if [ "${{ matrix.platform }}" = psc ]; then
            bash assemble-psc.sh "${{ needs.plan.outputs.version }}"
          elif [ "${{ matrix.platform }}" = win ]; then
            # the Windows product: the program folder zip and the NSIS installer (makensis from Ubuntu's nsis)
            sudo apt-get install -y -qq nsis >/dev/null
            bash assemble-win.sh "${{ needs.plan.outputs.version }}"
          else
            bash assemble.sh "${{ matrix.platform }}" "${{ needs.plan.outputs.version }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: payload-${{ matrix.platform }}
          # the zips are psc's (assemble-psc.sh), win's (assemble-win.sh) and the flasher (pcusb); on the other
          # Linux platforms only the tarball pattern matches
          path: |
            autobleem-${{ matrix.platform }}-*.tar.gz
            AutoBleemInstaller-*.zip
            AutoBleemFlasher-*.zip
            UpdateRoms-*.zip
            autobleem-win-product-*.zip
          if-no-files-found: error
          retention-days: 30
      # the NSIS installer goes on its own, unsigned: sign-win signs it and uploads it as payload-win-setup
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'win'
        with:
          name: win-setup-unsigned
          path: AutoBleemSetup-*.exe
          if-no-files-found: error
          retention-days: 7

  sign-win:
    # AutoBleemSetup-<v>.exe's Authenticode signature through SignPath (.signpath/artifact-configuration.xml;
    # autobleem-build's signpath-sign action has the rules - the programs inside arrive signed from their own
    # releases): a release must come back signed, a nightly ships unsigned when nobody approves it within the
    # hour. plan and assemble run on hosted runners, which SignPath requires; the self-hosted jobs come after.
    needs: [plan, assemble]
    if: needs.plan.outputs.skip != 'true' && contains(fromJSON(needs.plan.outputs.platforms), 'win')
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: read }
    steps:
      - uses: autobleem2/autobleem-build/.github/actions/signpath-sign@develop
        with:
          enabled: ${{ vars.AB_SIGNING_ENABLED == 'true' }}
          artifact: win-setup-unsigned
          path: setup
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          required: ${{ needs.plan.outputs.channel == 'release' }}
      - uses: actions/upload-artifact@v7
        with:
          name: payload-win-setup
          path: setup/AutoBleemSetup-*.exe
          if-no-files-found: error
          retention-days: 30

  image:
    # A separate gate from AB_CI_ENABLED: this job needs a self-hosted runner for THIS repo - registered
    # 2026-09-23 (psc-build, org-scoped). AB_IMAGE_BUILD_ENABLED keeps it from queuing forever on any repo
    # whose runner isn't there yet. The org's Default runner group also needed allows_public_repositories
    # flipped on (off by default - self-hosted runners don't serve public repos otherwise); safe here since
    # this workflow has no pull_request trigger, only push:tags and workflow_dispatch (both need write access).
    #
    # Persists the pristine "before AutoBleem" base across runs on the HOST (not actions/cache - see
    # AB_IMAGE_CACHE_DIR below and the image-build-cache-base memory note) so a repeat build skips the RPi
    # OS download / PC mmdebstrap step entirely.
    # plan's images: false is the packages-only build
    if: vars.AB_CI_ENABLED == 'true' && vars.AB_IMAGE_BUILD_ENABLED == 'true' && needs.plan.outputs.images == 'true'
    needs: [plan, assemble]
    strategy:
      fail-fast: false
      # plan's psc-filtered list, NOT the same one `assemble` uses: the console has no flashable image (a
      # stick tarball unpacked by AutoBleemInstaller.exe, not an .img.xz). A job-level `if:` can't see the
      # matrix context to exclude it there instead (found live, 2026-09-23 - "Unrecognized named-value:
      # 'matrix'"), so the exclusion happens in `plan` and this job's matrix simply never gets a psc entry.
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.image_platforms) }}
    runs-on: [self-hosted, linux, x64]
    # NOT a `container:` job: this runner is itself a Docker container (myoung34/github-runner), and the
    # Actions runner refuses to nest another container job inside one without container-hooks set up, which
    # this deployment doesn't have ("Container feature is not supported when runner is already running
    # inside container" - found on the first real run, 2026-09-23). The workaround every self-hosted job on
    # this runner needs: launch a SIBLING container by hand over the mounted docker.sock instead, with
    # -v "$PWD:$PWD" so the path resolves the same for the daemon as for the runner (RUNNER_WORK in
    # compose.yml exists for exactly this - the runner's workspace is bind-mounted at an identical path).
    env:
      # xz -T0 -2: the owner's fast-compression call (2026-09-23) - faster still than the scripts' own
      # default of 4 (which was itself already the fast choice over level 6, 7 min vs 12 for ~2% smaller).
      # Pinned explicitly so CI never silently drifts to a slower level.
      AB_XZ_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: payload-${{ matrix.platform }}
          path: dist
      # the site-publish tooling (repo_publish.sh + its page-generator merge), only needed on a real
      # release - a separate checkout since it split into its own repo (autobleem-repo).
      - uses: actions/checkout@v7
        if: startsWith(github.ref, 'refs/tags/v') || needs.plan.outputs.channel == 'nightly'
        with:
          repository: autobleem2/autobleem-repo
          path: autobleem-repo-tools
      - id: which
        run: |
          case "${{ matrix.platform }}" in
            rpi-armhf) echo "kind=rpi" >> "$GITHUB_OUTPUT"; echo "arch=armhf" >> "$GITHUB_OUTPUT" ;;
            rpi-arm64) echo "kind=rpi" >> "$GITHUB_OUTPUT"; echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
            pcusb)     echo "kind=pcusb" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build the ${{ matrix.platform }} image
        env:
          # a persistent HOST directory, not actions/cache: this runner is self-hosted (not an ephemeral
          # hosted VM), so there is no "the disk disappears after the job" problem for actions/cache to
          # solve - a plain host path is simpler and has no network upload/download cost at all. Pointed at
          # directly as --work, so make_rpi_image.sh's own --base skip-download and make_pc_image.sh's own
          # --reuse-root persist the base the MOMENT the download/mmdebstrap step writes it (the owner's
          # ask, 2026-09-23: "just after image decompression", "stored on host") - not deferred to a
          # separate copy-to-cache step at the very end, which loses everything if a later step (partition,
          # recompress) fails or is cancelled, as the first real run just did.
          AB_IMAGE_CACHE_DIR: /home/claude/ab-image-cache
        run: |
          set -euo pipefail
          rm -rf build_image && mkdir -p build_image/out
          cat > build_image/run.sh << 'BUILD_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          CACHE="$AB_IMAGE_CACHE_DIR/${{ matrix.platform }}"
          mkdir -p "$CACHE"
          # evict a base older than 30 days so the cache still refreshes periodically instead of going
          # stale forever (the actions/cache design's monthly key did this before; a host-persistent
          # directory needs its own eviction since nothing else ever clears it)
          find "$CACHE" -maxdepth 1 -name '*.img.xz' -mtime +30 -delete 2>/dev/null || true
          case "${{ steps.which.outputs.kind }}" in
            rpi)
              base_arg=()
              existing="$(ls "$CACHE"/*.img.xz 2>/dev/null | head -1 || true)"
              [ -n "$existing" ] && base_arg=(--base "$existing")
              # --rootless explicitly: the container runs as root (uid 0), and both scripts default to the
              # privileged --mount mode whenever EUID==0 - without this they pick --mount and then fail
              # missing loop-mount tools (found on the first real run, 2026-09-23: "missing required tool:
              # udevadm"). --rootless needs only debugfs/mtools/xz, all in this image, regardless of uid.
              # --keep-raw: leaves the decompressed ~3.1 GB raw .img in $CACHE too, which the script's own
              # newer-than check (2026-09-23) then reuses on the next run instead of re-decompressing (a
              # modest ~30s saving here, but free once the base itself is already cached) - costs that
              # extra disk space on the host permanently, on top of the ~550 MB compressed base.
              tools/make_rpi_image.sh --arch "${{ steps.which.outputs.arch }}" --rootless --keep-raw "${base_arg[@]}" \
                --package dist/autobleem-${{ matrix.platform }}-*.tar.gz \
                --work "$CACHE" --out build_image/out \
                --version "${{ needs.plan.outputs.version }}"
              ;;
            pcusb)
              # NOT --rootless here: mmdebstrap --mode=unshare needs /etc/subuid+subgid entries and a
              # non-root uid with a mapped account (docker/run.sh --userns fakes all of that) - real work
              # to set up for no real security gain, since this sibling container already reaches the
              # host's Docker socket (root-equivalent already). --mount (real root, the container's
              # default when EUID==0) needs only --privileged on the docker run below (found on the first
              # real run, 2026-09-23: "E: unable to unshare the mount namespace").
              # NOT --reuse-root here either, still - but for a different reason now (2026-09-26): the
              # AutoBleem package no longer lives inside mmdebstrap's customize-hook at all, so a plain run
              # already skips mmdebstrap on its own whenever $CACHE/root.tar + its .key file match this
              # run's release/mirror/architectures/package list (root_base_cache_key() in
              # make_pc_image.sh), and always injects THIS run's package fresh into a copy of it afterwards
              # - --reuse-root would only add "and skip even that check", which buys nothing here and would
              # risk missing a real root-recipe change (a new package in PACKAGES_COMMON, say). verify_image()
              # still refuses to ship a mismatched package regardless ("the package inside the image is X
              # bytes, the file is Y") - kept as a guard, not the only thing making this safe any more.
              tools/make_pc_image.sh --mount \
                --package dist/autobleem-pcusb-*.tar.gz \
                --work "$CACHE" --out build_image/out \
                --version "${{ needs.plan.outputs.version }}"
              ;;
          esac
          BUILD_EOF
          chmod +x build_image/run.sh
          # a sibling container over the mounted docker.sock, not a GHA `container:` job (see the job's own
          # comment) - the image is public, no login needed. Both $PWD (the checkout) and the persistent
          # cache dir are bind-mounted at identical paths so they resolve the same for the daemon as for
          # the runner. --privileged only for pcusb's --mount route (loop devices, grub-install) - rpi's
          # --rootless needs none of that.
          priv_arg=()
          [ "${{ steps.which.outputs.kind }}" = pcusb ] && priv_arg=(--privileged)
          docker run --rm "${priv_arg[@]}" \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$AB_IMAGE_CACHE_DIR:$AB_IMAGE_CACHE_DIR" \
            -e AB_IMAGE_CACHE_DIR -e AB_XZ_LEVEL \
            ghcr.io/autobleem2/autobleem-build:${{ needs.plan.outputs.channel == 'nightly' && 'develop' || 'latest' }} \
            bash "$PWD/build_image/run.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.platform }}
          path: build_image/out/*
          retention-days: 30
      # push straight onto the real site (autobleem.retromenele.pl), only for a real release. --local:
      # this runner IS the build server, so it's a plain filesystem copy into REPO_DIR - no ssh, no gh CLI
      # (never installed on the server on purpose). Also bind-mounts REPO_DIR itself into the sibling
      # container, since that's what --local writes into directly.
      - name: Publish the image to the site
        if: startsWith(github.ref, 'refs/tags/v') || needs.plan.outputs.channel == 'nightly'
        env:
          AB_REPO_DIR: /home/claude/autobleem-repo
        run: |
          set -euo pipefail
          if [ "${{ needs.plan.outputs.channel }}" = nightly ]; then
            # a development build's images go next to its packages in nightly/<version>/ - not to
            # rpi-imager/images/ nor pc/images/. A Pi image brings its rpi_imager_repo.json (merged with the
            # other architecture's, as for a release below): repo_index.py makes rpi-imager/os_list-nightly.json,
            # Imager's nightly repository, from it
            V="${{ needs.plan.outputs.version }}"
            extra=()
            if [ "${{ steps.which.outputs.kind }}" = rpi ]; then
              mkdir -p build_image/site
              docker run --rm \
                -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
                ghcr.io/autobleem2/autobleem-build:${{ needs.plan.outputs.channel == 'nightly' && 'develop' || 'latest' }} \
                python3 tools/merge_rpi_imager_json.py build_image/out/rpi_imager_repo.json \
                  "$AB_REPO_DIR/nightly/$V/rpi_imager_repo.json" build_image/site/rpi_imager_repo.json
              extra=(build_image/site/rpi_imager_repo.json)
            fi
            docker run --rm \
              -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
              ghcr.io/autobleem2/autobleem-build:${{ needs.plan.outputs.channel == 'nightly' && 'develop' || 'latest' }} \
              bash autobleem-repo-tools/tools/repo_publish.sh --local --partial nightly "$V" build_image/out/*.img.xz "${extra[@]}"
            exit 0
          fi
          case "${{ steps.which.outputs.kind }}" in
            rpi)
              # rpi-armhf and rpi-arm64 both publish into the SAME rpi-imager/images/<version>/ - each
              # build only fills its OWN os_list entry, leaving the other one as raw __PLACEHOLDER__ tokens
              # (make_rpi_image.sh always starts from the checked-in template) - publishing that as-is
              # overwrites whichever architecture published first back to broken placeholders (found live
              # on the site, 2026-09-23). Merge with what's already there before publishing.
              mkdir -p build_image/site
              docker run --rm \
                -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
                ghcr.io/autobleem2/autobleem-build:${{ needs.plan.outputs.channel == 'nightly' && 'develop' || 'latest' }} \
                python3 tools/merge_rpi_imager_json.py build_image/out/rpi_imager_repo.json \
                  "$AB_REPO_DIR/rpi-imager/images/${{ needs.plan.outputs.version }}/rpi_imager_repo.json" \
                  build_image/site/rpi_imager_repo.json
              docker run --rm \
                -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
                ghcr.io/autobleem2/autobleem-build:${{ needs.plan.outputs.channel == 'nightly' && 'develop' || 'latest' }} \
                bash autobleem-repo-tools/tools/repo_publish.sh --local image \
                  "${{ needs.plan.outputs.version }}" build_image/out/*.img.xz build_image/site/rpi_imager_repo.json
              ;;
            pcusb)
              docker run --rm \
                -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
                ghcr.io/autobleem2/autobleem-build:${{ needs.plan.outputs.channel == 'nightly' && 'develop' || 'latest' }} \
                bash autobleem-repo-tools/tools/repo_publish.sh --local pc-image \
                  "${{ needs.plan.outputs.version }}" build_image/out/*.img.xz
              ;;
          esac

  release:
    # image is in needs so its artifacts are available when it ran, but it's gated off until a self-hosted
    # runner is registered and GitHub skips (not fails) a gated-off job - `if: always()` here keeps this job
    # from being skipped in turn just because `image` was skipped; it still requires assemble to have passed.
    # sign-win likewise: skipped by a run without win
    needs: [plan, assemble, image, sign-win]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.assemble.result == 'success' &&
      (needs.sign-win.result == 'success' || needs.sign-win.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: payload-*
          path: out
          merge-multiple: true
      - name: Also attach any built images (best effort - the image job may be gated off)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: out
          merge-multiple: true
      - name: Attach assembled payloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          shopt -s nullglob; files=(out/*.tar.gz out/*.zip out/*.exe)
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "AutoBleem appliance ${GITHUB_REF_NAME}" --generate-notes $prerelease "${files[@]}" || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "${files[@]}" --clobber

  publish-release:
    # separate from the GH release above: this is the site's releases/<version>/ - what the launcher's own
    # auto-updater reads (releases/latest.json / unstable.json, UpdateService) and what the landing page's
    # "Install" panel shows. Missing until now (2026-09-23, the owner caught it): image publishing only ever
    # touched rpi-imager/images/, never this. Self-hosted (needs REPO_DIR), so a separate job from `release`
    # above (which only needs GITHUB_TOKEN). needs plan+assemble only - doesn't need image, which can be
    # gated off independently.
    # sign-win: the signed AutoBleemSetup-<v>.exe (payload-win-setup); always() because a run without win skips it
    needs: [plan, assemble, sign-win]
    if: >-
      always() && needs.assemble.result == 'success' &&
      (needs.sign-win.result == 'success' || needs.sign-win.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || needs.plan.outputs.channel == 'nightly')
    runs-on: [self-hosted, linux, x64]
    env:
      AB_REPO_DIR: /home/claude/autobleem-repo
    steps:
      - uses: actions/checkout@v7
        with:
          repository: autobleem2/autobleem-repo
          path: autobleem-repo-tools
      - uses: actions/download-artifact@v8
        with:
          pattern: payload-*
          path: out
          merge-multiple: true
      - name: Publish releases/${{ needs.plan.outputs.version }} to the site
        run: |
          set -euo pipefail
          # needs.plan.outputs.version is the pushed tag verbatim (GITHUB_REF_NAME on a v* tag) - the SAME
          # string every component's own build embeds as its version when built at an exact, clean tag (no
          # -<hash> suffix), which is what makes the auto-updater's version comparison agree instead of
          # looping (see the update-version-match memory note) - never rename this folder by hand.
          # The psc zips (AutoBleemInstaller, UpdateRoms) go in the same folder: the installer takes UpdateRoms
          # from the release whose psc-fs is its own package.
          shopt -s nullglob; files=(out/*.tar.gz out/*.zip out/*.exe)
          kind=(release)
          if [ "${{ needs.plan.outputs.channel }}" = nightly ]; then
            # a development build: nightly/<version>/, a piece of it (publish-nightly below finishes it)
            kind=(--partial nightly)
          fi
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
            ghcr.io/autobleem2/autobleem-build:${{ needs.plan.outputs.channel == 'nightly' && 'develop' || 'latest' }} \
            bash autobleem-repo-tools/tools/repo_publish.sh --local "${kind[@]}" \
              "${{ needs.plan.outputs.version }}" "${files[@]}"

  publish-nightly:
    # a development build's last publish: every piece (the images, the packages) went up with --partial and
    # the site's index left the folder out, so the previous nightly stayed whole meanwhile. This publishes the
    # fingerprint of what the build was made from (sources.json - the next scheduled run compares it to skip an
    # unchanged night), takes the .incomplete marker away and indexes: the new build replaces the previous one
    # only now. A run with a failed image never gets here - the previous nightly stays, the unfinished folder
    # is removed by the index two days later, and without its sources.json the next night builds again.
    needs: [plan, assemble, image, publish-release]
    # always(): a run of platforms without an image (psc, win) skips `image`, which would skip this job too
    if: >-
      always() && needs.plan.outputs.channel == 'nightly' && needs.publish-release.result == 'success' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: [self-hosted, linux, x64]
    env:
      AB_REPO_DIR: /home/claude/autobleem-repo
    steps:
      - uses: actions/checkout@v7
        with:
          repository: autobleem2/autobleem-repo
          path: autobleem-repo-tools
      - name: Publish nightly/${{ needs.plan.outputs.version }} as the development build
        run: |
          set -euo pipefail
          mkdir -p out
          printf '{"sources": "%s", "images": %s, "platforms": "%s", "run": "%s/%s/actions/runs/%s"}\n' \
            "${{ needs.plan.outputs.sources }}" "${{ needs.plan.outputs.images }}" "${{ needs.plan.outputs.platform_list }}" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > out/sources.json
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
            ghcr.io/autobleem2/autobleem-build:develop \
            bash autobleem-repo-tools/tools/repo_publish.sh --local nightly \
              "${{ needs.plan.outputs.version }}" out/sources.json
