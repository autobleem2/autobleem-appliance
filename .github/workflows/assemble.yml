# Assemble the appliance payloads from PUBLISHED component artifacts - the compile-once/assemble-many
# model (docs/repo-split-analysis.md). This workflow compiles NOTHING: assemble.sh fetches each Linux
# component's release assets (the launcher incl. abpad + themes from autobleem2/autobleem, the two emulators
# from autobleem2/pcsx-ab and pcsx-abnxt) at one unified VERSION and composes payload_linux into
# autobleem-<platform>-<version>.tar.gz; assemble-psc.sh does the same for the console (platform "psc") from
# the launcher's psc artifact (which also carries the psc skeleton - see publish-launcher.yml), the console
# tools (autobleem2/autobleem-console-tools) and the emulators' -psc assets, into
# autobleem-psc-<version>.tar.gz - no RetroArch and no cover databases, same reasoning as the Linux
# appliances' install-time fetches (the console has no network at all, so AutoBleemInstaller.exe fetches
# those on the PC instead - see assemble-psc.sh's own header). "psc" is not in the default platforms list
# yet (untested in this workflow) - pass it explicitly via workflow_dispatch until proven.
#
# Because it only downloads + tars, it runs on a plain hosted runner (gh is preinstalled there). Building the
# flashable .img.xz from a payload is a separate, self-hosted step (it needs root/loop-mount or the rootless
# debugfs path and the autobleem-build image's tools) - see tools/make_rpi_image.sh / make_pc_image.sh; that
# job is added once a self-hosted runner is registered for this repo.
#
# A v* tag on this repo is the normal trigger (VERSION = the tag itself - every component must already have
# a release there, which the emulators + the launcher publish on their own v* tags); workflow_dispatch takes
# an explicit version for a re-run or a dry run against an unreleased version. Gated by AB_CI_ENABLED.
name: assemble

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: the unified component version to assemble (e.g. v2.0.0-alpha1) - defaults to the pushed tag
        type: string
      platforms:
        description: platforms to assemble (space separated; rpi-armhf rpi-arm64 pcusb psc)
        type: string
        default: 'rpi-armhf rpi-arm64 pcusb'

concurrency:
  group: assemble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.p.outputs.json }}
      image_platforms: ${{ steps.p.outputs.image_json }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: p
        run: |
          p="${{ inputs.platforms }}"; [ -n "$p" ] || p="rpi-armhf rpi-arm64 pcusb"
          echo "json=$(printf '%s\n' $p | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          # a separate, psc-filtered list for the image job below: the console has no flashable image (a
          # stick tarball unpacked by AutoBleemInstaller.exe, not an .img.xz), and matrix context isn't
          # available in a job-level `if:` (found live, 2026-09-23 - "Unrecognized named-value: 'matrix'"),
          # so the exclusion has to happen here instead of inside that job.
          echo "image_json=$(printf '%s\n' $p | { grep -v '^psc$' || true; } | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - id: v
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; fi
          [ -n "$v" ] || { echo "no version: push a v* tag, or pass workflow_dispatch's version input" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  assemble:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ubuntu-24.04
    env:
      # assemble.sh reaches the other public repos' releases through gh; the repo-scoped token reads public
      # releases across the org fine.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble ${{ matrix.platform }} @ ${{ needs.plan.outputs.version }}
        run: |
          if [ "${{ matrix.platform }}" = psc ]; then
            bash assemble-psc.sh "${{ needs.plan.outputs.version }}"
          else
            bash assemble.sh "${{ matrix.platform }}" "${{ needs.plan.outputs.version }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: payload-${{ matrix.platform }}
          # the zips are psc's alone (assemble-psc.sh); on the Linux platforms those two patterns match nothing
          path: |
            autobleem-${{ matrix.platform }}-*.tar.gz
            AutoBleemInstaller-*.zip
            UpdateRoms-*.zip
          if-no-files-found: error
          retention-days: 30

  image:
    # A separate gate from AB_CI_ENABLED: this job needs a self-hosted runner for THIS repo - registered
    # 2026-09-23 (psc-build, org-scoped). AB_IMAGE_BUILD_ENABLED keeps it from queuing forever on any repo
    # whose runner isn't there yet. The org's Default runner group also needed allows_public_repositories
    # flipped on (off by default - self-hosted runners don't serve public repos otherwise); safe here since
    # this workflow has no pull_request trigger, only push:tags and workflow_dispatch (both need write access).
    #
    # Persists the pristine "before AutoBleem" base across runs on the HOST (not actions/cache - see
    # AB_IMAGE_CACHE_DIR below and the image-build-cache-base memory note) so a repeat build skips the RPi
    # OS download / PC mmdebstrap step entirely.
    if: vars.AB_CI_ENABLED == 'true' && vars.AB_IMAGE_BUILD_ENABLED == 'true'
    needs: [plan, assemble]
    strategy:
      fail-fast: false
      # plan's psc-filtered list, NOT the same one `assemble` uses: the console has no flashable image (a
      # stick tarball unpacked by AutoBleemInstaller.exe, not an .img.xz). A job-level `if:` can't see the
      # matrix context to exclude it there instead (found live, 2026-09-23 - "Unrecognized named-value:
      # 'matrix'"), so the exclusion happens in `plan` and this job's matrix simply never gets a psc entry.
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.image_platforms) }}
    runs-on: [self-hosted, linux, x64]
    # NOT a `container:` job: this runner is itself a Docker container (myoung34/github-runner), and the
    # Actions runner refuses to nest another container job inside one without container-hooks set up, which
    # this deployment doesn't have ("Container feature is not supported when runner is already running
    # inside container" - found on the first real run, 2026-09-23). The workaround every self-hosted job on
    # this runner needs: launch a SIBLING container by hand over the mounted docker.sock instead, with
    # -v "$PWD:$PWD" so the path resolves the same for the daemon as for the runner (RUNNER_WORK in
    # compose.yml exists for exactly this - the runner's workspace is bind-mounted at an identical path).
    env:
      # xz -T0 -2: the owner's fast-compression call (2026-09-23) - faster still than the scripts' own
      # default of 4 (which was itself already the fast choice over level 6, 7 min vs 12 for ~2% smaller).
      # Pinned explicitly so CI never silently drifts to a slower level.
      AB_XZ_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: payload-${{ matrix.platform }}
          path: dist
      # the site-publish tooling (repo_publish.sh + its page-generator merge), only needed on a real
      # release - a separate checkout since it split into its own repo (autobleem-repo).
      - uses: actions/checkout@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repository: autobleem2/autobleem-repo
          path: autobleem-repo-tools
      - id: which
        run: |
          case "${{ matrix.platform }}" in
            rpi-armhf) echo "kind=rpi" >> "$GITHUB_OUTPUT"; echo "arch=armhf" >> "$GITHUB_OUTPUT" ;;
            rpi-arm64) echo "kind=rpi" >> "$GITHUB_OUTPUT"; echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
            pcusb)     echo "kind=pcusb" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build the ${{ matrix.platform }} image
        env:
          # a persistent HOST directory, not actions/cache: this runner is self-hosted (not an ephemeral
          # hosted VM), so there is no "the disk disappears after the job" problem for actions/cache to
          # solve - a plain host path is simpler and has no network upload/download cost at all. Pointed at
          # directly as --work, so make_rpi_image.sh's own --base skip-download and make_pc_image.sh's own
          # --reuse-root persist the base the MOMENT the download/mmdebstrap step writes it (the owner's
          # ask, 2026-09-23: "just after image decompression", "stored on host") - not deferred to a
          # separate copy-to-cache step at the very end, which loses everything if a later step (partition,
          # recompress) fails or is cancelled, as the first real run just did.
          AB_IMAGE_CACHE_DIR: /home/claude/ab-image-cache
        run: |
          set -euo pipefail
          rm -rf build_image && mkdir -p build_image/out
          cat > build_image/run.sh << 'BUILD_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          CACHE="$AB_IMAGE_CACHE_DIR/${{ matrix.platform }}"
          mkdir -p "$CACHE"
          # evict a base older than 30 days so the cache still refreshes periodically instead of going
          # stale forever (the actions/cache design's monthly key did this before; a host-persistent
          # directory needs its own eviction since nothing else ever clears it)
          find "$CACHE" -maxdepth 1 -name '*.img.xz' -mtime +30 -delete 2>/dev/null || true
          case "${{ steps.which.outputs.kind }}" in
            rpi)
              base_arg=()
              existing="$(ls "$CACHE"/*.img.xz 2>/dev/null | head -1 || true)"
              [ -n "$existing" ] && base_arg=(--base "$existing")
              # --rootless explicitly: the container runs as root (uid 0), and both scripts default to the
              # privileged --mount mode whenever EUID==0 - without this they pick --mount and then fail
              # missing loop-mount tools (found on the first real run, 2026-09-23: "missing required tool:
              # udevadm"). --rootless needs only debugfs/mtools/xz, all in this image, regardless of uid.
              # --keep-raw: leaves the decompressed ~3.1 GB raw .img in $CACHE too, which the script's own
              # newer-than check (2026-09-23) then reuses on the next run instead of re-decompressing (a
              # modest ~30s saving here, but free once the base itself is already cached) - costs that
              # extra disk space on the host permanently, on top of the ~550 MB compressed base.
              tools/make_rpi_image.sh --arch "${{ steps.which.outputs.arch }}" --rootless --keep-raw "${base_arg[@]}" \
                --package dist/autobleem-${{ matrix.platform }}-*.tar.gz \
                --work "$CACHE" --out build_image/out \
                --version "${{ needs.plan.outputs.version }}"
              ;;
            pcusb)
              # NOT --rootless here: mmdebstrap --mode=unshare needs /etc/subuid+subgid entries and a
              # non-root uid with a mapped account (docker/run.sh --userns fakes all of that) - real work
              # to set up for no real security gain, since this sibling container already reaches the
              # host's Docker socket (root-equivalent already). --mount (real root, the container's
              # default when EUID==0) needs only --privileged on the docker run below (found on the first
              # real run, 2026-09-23: "E: unable to unshare the mount namespace").
              # NOT --reuse-root: it skips mmdebstrap entirely, INCLUDING its customize-hook that injects
              # the AutoBleem package - so a reused root keeps whatever package was baked in last time, with
              # no way to update it. Safe only when the exact same content is being rebuilt (a dev-iteration
              # shortcut); unsafe here since a real build's package differs every time. Found the hard way,
              # 2026-09-23: verify_image() correctly refused to ship a stale/mismatched package rather than
              # silently produce a broken image ("the package inside the image is X bytes, the file is Y").
              tools/make_pc_image.sh --mount \
                --package dist/autobleem-pcusb-*.tar.gz \
                --work "$CACHE" --out build_image/out \
                --version "${{ needs.plan.outputs.version }}"
              ;;
          esac
          BUILD_EOF
          chmod +x build_image/run.sh
          # a sibling container over the mounted docker.sock, not a GHA `container:` job (see the job's own
          # comment) - the image is public, no login needed. Both $PWD (the checkout) and the persistent
          # cache dir are bind-mounted at identical paths so they resolve the same for the daemon as for
          # the runner. --privileged only for pcusb's --mount route (loop devices, grub-install) - rpi's
          # --rootless needs none of that.
          priv_arg=()
          [ "${{ steps.which.outputs.kind }}" = pcusb ] && priv_arg=(--privileged)
          docker run --rm "${priv_arg[@]}" \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$AB_IMAGE_CACHE_DIR:$AB_IMAGE_CACHE_DIR" \
            -e AB_IMAGE_CACHE_DIR -e AB_XZ_LEVEL \
            ghcr.io/autobleem2/autobleem-build:latest \
            bash "$PWD/build_image/run.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.platform }}
          path: build_image/out/*
          retention-days: 30
      # push straight onto the real site (autobleem.retromenele.pl), only for a real release. --local:
      # this runner IS the build server, so it's a plain filesystem copy into REPO_DIR - no ssh, no gh CLI
      # (never installed on the server on purpose). Also bind-mounts REPO_DIR itself into the sibling
      # container, since that's what --local writes into directly.
      - name: Publish the image to the site
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AB_REPO_DIR: /home/claude/autobleem-repo
        run: |
          set -euo pipefail
          case "${{ steps.which.outputs.kind }}" in
            rpi)
              # rpi-armhf and rpi-arm64 both publish into the SAME rpi-imager/images/<version>/ - each
              # build only fills its OWN os_list entry, leaving the other one as raw __PLACEHOLDER__ tokens
              # (make_rpi_image.sh always starts from the checked-in template) - publishing that as-is
              # overwrites whichever architecture published first back to broken placeholders (found live
              # on the site, 2026-09-23). Merge with what's already there before publishing.
              mkdir -p build_image/site
              docker run --rm \
                -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
                ghcr.io/autobleem2/autobleem-build:latest \
                python3 tools/merge_rpi_imager_json.py build_image/out/rpi_imager_repo.json \
                  "$AB_REPO_DIR/rpi-imager/images/${{ needs.plan.outputs.version }}/rpi_imager_repo.json" \
                  build_image/site/rpi_imager_repo.json
              docker run --rm \
                -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
                ghcr.io/autobleem2/autobleem-build:latest \
                bash autobleem-repo-tools/tools/repo_publish.sh --local image \
                  "${{ needs.plan.outputs.version }}" build_image/out/*.img.xz build_image/site/rpi_imager_repo.json
              ;;
            pcusb)
              docker run --rm \
                -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
                ghcr.io/autobleem2/autobleem-build:latest \
                bash autobleem-repo-tools/tools/repo_publish.sh --local pc-image \
                  "${{ needs.plan.outputs.version }}" build_image/out/*.img.xz
              ;;
          esac

  release:
    # image is in needs so its artifacts are available when it ran, but it's gated off until a self-hosted
    # runner is registered and GitHub skips (not fails) a gated-off job - `if: always()` here keeps this job
    # from being skipped in turn just because `image` was skipped; it still requires assemble to have passed.
    needs: [plan, assemble, image]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.assemble.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: payload-*
          path: out
          merge-multiple: true
      - name: Also attach any built images (best effort - the image job may be gated off)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: out
          merge-multiple: true
      - name: Attach assembled payloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          shopt -s nullglob; files=(out/*.tar.gz out/*.zip)
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "AutoBleem appliance ${GITHUB_REF_NAME}" --generate-notes $prerelease "${files[@]}" || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "${files[@]}" --clobber

  publish-release:
    # separate from the GH release above: this is the site's releases/<version>/ - what the launcher's own
    # auto-updater reads (releases/latest.json / unstable.json, UpdateService) and what the landing page's
    # "Install" panel shows. Missing until now (2026-09-23, the owner caught it): image publishing only ever
    # touched rpi-imager/images/, never this. Self-hosted (needs REPO_DIR), so a separate job from `release`
    # above (which only needs GITHUB_TOKEN). needs plan+assemble only - doesn't need image, which can be
    # gated off independently.
    needs: [plan, assemble]
    if: startsWith(github.ref, 'refs/tags/v') && needs.assemble.result == 'success'
    runs-on: [self-hosted, linux, x64]
    env:
      AB_REPO_DIR: /home/claude/autobleem-repo
    steps:
      - uses: actions/checkout@v7
        with:
          repository: autobleem2/autobleem-repo
          path: autobleem-repo-tools
      - uses: actions/download-artifact@v8
        with:
          pattern: payload-*
          path: out
          merge-multiple: true
      - name: Publish releases/${{ needs.plan.outputs.version }} to the site
        run: |
          set -euo pipefail
          # needs.plan.outputs.version is the pushed tag verbatim (GITHUB_REF_NAME on a v* tag) - the SAME
          # string every component's own build embeds as its version when built at an exact, clean tag (no
          # -<hash> suffix), which is what makes the auto-updater's version comparison agree instead of
          # looping (see the update-version-match memory note) - never rename this folder by hand.
          # The psc zips (AutoBleemInstaller, UpdateRoms) go in the same folder: the installer takes UpdateRoms
          # from the release whose psc-fs is its own package.
          shopt -s nullglob; files=(out/*.tar.gz out/*.zip)
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
            ghcr.io/autobleem2/autobleem-build:latest \
            bash autobleem-repo-tools/tools/repo_publish.sh --local release \
              "${{ needs.plan.outputs.version }}" "${files[@]}"
