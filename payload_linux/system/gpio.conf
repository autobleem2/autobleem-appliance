# AutoBleem case wiring (AUTOBLEEM-4). Shell syntax, KEY=value. install.sh creates this file only when it is
# absent, so edits survive --update. Change a value, then run `sudo bash install.sh --update` (or edit the
# AutoBleem block in config.txt by hand) and reboot: the pins live in config.txt's dtoverlays.
#
# POWER button: BCM GPIO (default 3 = pin 5, to GND). Press = clean poweroff; the same press wakes the Pi
# from halt (GPIO3 only - the firmware wakes on that pin).
POWER_GPIO=3
# RESET button: BCM GPIO (default 23 = pin 16, to GND). Sends KEY_PLAYPAUSE, as the console's Reset does.
RESET_GPIO=23
# Status LED: none | plain (GPIO14/TXD, pin 8, enable_uart=1, no software) | pixel (one WS2812B on GPIO10 /
# SPI0 MOSI, pin 19: green when the launcher starts, orange while powering off)
LED_TYPE=none
LED_SPI=/dev/spidev0.0
