# tools/make_rpi_image.sh puts this next to Raspberry Pi OS's user-creation wizard (userconfig.service, shown on
# tty8 when Raspberry Pi Imager gave no user): the image carries the AutoBleem boot splash (plymouth), and the
# wizard's dialog would be hidden behind it until plymouth quits. Waiting for that is a no-op on an image
# without plymouth.
[Unit]
After=plymouth-quit-wait.service
